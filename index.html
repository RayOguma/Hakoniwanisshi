<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>箱庭日誌</title>
    <meta name="description" content="古いホームページの住人たちと、ページを直していく物語" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- 主人公のブラウザの窓。はじめは検索エンジンのタブだけ -->
    <div id="browser">
      <div id="tabs">
        <button class="tab active" data-tab="search" type="button">🔍 Sagasu</button>
        <button class="tab" data-tab="site" type="button" hidden>🏠 箱庭日誌</button>
        <button class="tab" data-tab="guide" type="button" hidden>📘 やさしいHTML・CSS入門</button>
        <button class="tab" data-tab="server" type="button" hidden>🖥 さくさくサーバー</button>
        <button class="tab" data-tab="takao" type="button" hidden>⛰ 高尾山 登山ガイド</button>
        <button class="tab" data-tab="cafe" type="button" hidden>☕ 喫茶ポプラ</button>
        <button class="tab" data-tab="kotori" type="button" hidden>🐦 ことりサーバー</button>
        <div class="tab-spacer"></div>
        <span id="days-chip" hidden>サービス終了まで あと <b class="days-left">7</b> 日</span>
        <button id="btn-source" class="tool" type="button" hidden>&lt;/&gt; ソースを見る <kbd>S</kbd></button>
        <button id="btn-menu" class="tool" type="button">☰ メニュー</button>
      </div>
      <div id="address">https://www.sagasu.example/</div>
      <div id="views">
        <div id="view-search" class="view active"></div>
        <div id="view-site" class="view">
          <div id="site-wrap"><div id="site"></div></div>
          <aside id="source" hidden></aside>
        </div>
        <div id="view-guide" class="view"></div>
        <div id="view-server" class="view"></div>
        <div id="view-takao" class="view"></div>
        <div id="view-cafe" class="view"></div>
        <div id="view-kotori" class="view"></div>
        <div id="dialog" hidden></div>
        <div id="fade"><div id="fade-text"></div></div>
      </div>
    </div>
    <!-- タイトル画面（仮）。画像ができたら、#title の背景に入れる -->
    <div id="title">
      <div class="tt-cubes">
        <div class="tt-cube" style="--c:#a9b8c8">-h-</div>
        <div class="tt-cube big" style="--c:#f28cb4">・v・</div>
        <div class="tt-cube" style="--c:#f4cc7c">・w・</div>
      </div>
      <h1 class="tt-logo">箱庭日誌</h1>
      <div class="tt-sub">〜 定年エンジニアの手作りページ 〜</div>
      <button id="tt-start" type="button">はじめる</button>
      <button id="tt-continue" type="button" hidden>つづきから</button>
      <button id="tt-settings" type="button">⚙ 設定</button>
      <div class="tt-note">試作版</div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
